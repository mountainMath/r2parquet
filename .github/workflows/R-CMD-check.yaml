# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release', dependencies: '"all"', extra-packages: 'any::rcmdcheck'}
          - {os: windows-latest, r: 'release', dependencies: '"all"', extra-packages: 'any::rcmdcheck'}
          # polars has no Linux binaries on r-multiverse and building it needs Rust, so Linux checks
          # without polars: hard dependencies plus the other Suggests
          - {os: ubuntu-latest,  r: 'release', dependencies: '"hard"',
             extra-packages: 'any::rcmdcheck, any::arrow, any::ggplot2, any::knitr, any::rmarkdown, any::testthat, any::withr'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      R2_TEST_BUCKET: ${{ secrets.R2_TEST_BUCKET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          # polars is not on CRAN
          extra-repositories: https://community.r-multiverse.org

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: ${{ matrix.config.dependencies }}
          extra-packages: ${{ matrix.config.extra-packages }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
