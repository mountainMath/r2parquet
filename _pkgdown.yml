url: https://mountainmath.github.io/r2parquet/

template:
  bootstrap: 5
  light-switch: true

reference:
- title: Reading publicly hosted data
  desc: No credentials needed for public URLs, presigned URLs and local files. `parquet_tbl()` also reads private buckets as `r2://bucket/path`.
  contents:
  - parquet_tbl
  - st_filter.tbl_duckdb_connection
  - collect_parquet
  - parquet_metadata
  - list_parquet
  - cache_parquet
  - list_parquet_cache
  - remove_parquet_from_cache
  - clear_cache_checks
  - parquet_connection
- title: Uploading and managing data on R2 and S3
  desc: Need the R2 credentials (see the README), or for `s3://bucket/path` the AWS ones (see `set_s3_public_access()`), except `data_to_parquet()` for local paths.
- subtitle: Buckets
  contents:
  - create_r2_bucket
  - set_s3_public_access
- subtitle: Writing and uploading
  contents:
  - data_to_parquet
  - upload_parquet
  - remove_parquet
  - write_manifest
- subtitle: Sharing private files
  contents:
  - presigned_url
