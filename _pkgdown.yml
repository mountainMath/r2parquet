url: https://mountainmath.github.io/r2parquet/

template:
  bootstrap: 5
  light-switch: true

reference:
- title: Reading publicly hosted data
  desc: No credentials needed for public URLs, presigned URLs and local files. `parquet_tbl()` also reads private buckets as `r2://bucket/path`.
  contents:
  - parquet_tbl
  - filter_spatial
  - collect_parquet
  - parquet_metadata
- title: Uploading and managing data on R2
  desc: Need the R2 credentials (see the README), except `data_to_parquet()` for local paths.
- subtitle: Buckets
  contents:
  - create_r2_bucket
- subtitle: Writing and uploading
  contents:
  - data_to_parquet
  - upload_parquet
  - remove_parquet
- subtitle: Sharing private files
  contents:
  - presigned_url
